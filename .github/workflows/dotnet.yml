name: .NET

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "PPSHGram.*/**"
      - "PPSHGram.slnx"
  pull_request:
    branches:
      - main
    paths:
      - "PPSHGram.*/**"
      - "PPSHGram.slnx"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  SOLUTION: PPSHGram.slnx

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Test
        run: dotnet test "${{ env.SOLUTION }}" --configuration "${{ env.CONFIGURATION }}" --no-build --verbosity normal

  publish:
    name: Release and publish NuGet packages
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_tag="$RELEASE_TAG"
          tag="${release_tag#v}"
          if [[ ! "$tag" =~ ^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$release_tag' is not a valid NuGet package version." >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.release_tag }}" --verify-tag --title "${{ steps.version.outputs.release_tag }}" --generate-notes

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Pack PPSHGram.Core
        run: dotnet pack PPSHGram.Core/PPSHGram.Core.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore --output artifacts /p:PackageVersion="${{ steps.version.outputs.package_version }}"

      - name: Pack PPSHGram.Telegram
        run: dotnet pack PPSHGram.Telegram/PPSHGram.Telegram.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore --output artifacts /p:PackageVersion="${{ steps.version.outputs.package_version }}"

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
